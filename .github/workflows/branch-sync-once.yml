name: branch-sync-once

# 【一時的な workflow】claude/popular-mods-setup-2cjskf ブランチ専用。
# Claude Code の実行環境から Modrinth API に到達できないため、
# catalog → packs の sync をランナー側で実行してブランチに直接コミットする。
# 反映が終わったらこのファイルは削除する。
on:
  push:
    branches:
      - claude/popular-mods-setup-2cjskf

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Install packwiz
        run: go install github.com/packwiz/packwiz@latest

      - name: Sync catalog to packs
        run: |
          export PATH="$PATH:$(go env GOPATH)/bin"
          for dir in packs/*/; do
            [ -f "$dir/pack.toml" ] || continue
            ./scripts/sync.sh "$dir"
          done

      - name: Check mod compatibility
        run: |
          for dir in packs/*/; do
            [ -f "$dir/pack.toml" ] || continue
            ./scripts/check-compat.sh "$dir"
          done

      - name: Commit and push result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add packs/
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "feat: catalogの便利modをパックへ反映 (sync via Actions)"
            git push
          fi
